[build]
  command = "npm run build"
  publish = "_site"
  # Bygg bara main. Admin sparar på grenen utkast, som inte ska byggas (sparar Netlify-credits);
  # hemsidan uppdateras när någon trycker Publicera i admin. (exit 0 = hoppa över bygget)
  ignore = "if [ \"$BRANCH\" != \"main\" ]; then exit 0; fi; exit 1"

[build.environment]
  NODE_VERSION = "22"

# kommun.matpafat.se visar beställningssidan för Kungälvs kommun (startsidan på den adressen).
# Övriga adresser (bilder, typsnitt, css) fungerar som vanligt på samma domän.
[[redirects]]
  from = "https://kommun.matpafat.se/"
  to = "/kommun/"
  status = 200
  force = true

# Gamla Webnode-adresser skickas till rätt ställe på nya sidan
[[redirects]]
  from = "/catering/"
  to = "/catering-kungalv/"
  status = 301
[[redirects]]
  from = "/kock-pa-plats/"
  to = "/privat-kock/"
  status = 301
[[redirects]]
  from = "/delikatesser/"
  to = "/#butik"
  status = 301
[[redirects]]
  from = "/kontakt/"
  to = "/#kontakt"
  status = 301

[[headers]]
  for = "/kommun/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex"
